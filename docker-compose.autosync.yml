# Local side-by-side instance for the Autosync worktree.
# Deliberately standalone (not an `extends:` of docker-compose.yml):
# the !override tag used previously requires Compose v2.24+ and broke
# older installations at parse time. Declaring the full service keeps
# the file self-contained and parseable by any Compose v2 version.
services:
  mediahub:
    image: espuino-mediahub-autosync
    container_name: espuino-mediahub-autosync
    user: "33:33"
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
      - ${MEDIAHUB_MEDIA_HOST:-./media}:/media:ro
    environment:
      - MEDIAHUB_DATA=/data
      - MEDIAHUB_MEDIA=/media
      - TZ=Europe/Berlin
    restart: unless-stopped
